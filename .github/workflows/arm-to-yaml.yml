name: Convert ARM Templates to YAML

on:
  push:
    paths:
      - "arm/**"
      # The converter's output depends on these, so they must re-run the sync.
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/sync_arm_to_yaml.py"
      - ".github/workflows/arm-to-yaml.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Two quick pushes must not race for the bot's commit/push. Queue instead of
# cancelling so every run starts from the latest ref.
concurrency:
  group: arm-to-yaml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tentacle-conv
        run: go build -o tentacle-conv ./cmd/tentacle-conv

      - name: Ensure yaml output directory exists
        run: mkdir -p yaml

      - name: Run ARM to YAML sync
        run: |
          set -euo pipefail
          python3 scripts/sync_arm_to_yaml.py

      - name: Commit converted YAML files and manifests
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yaml/
          git add arm/*.manifest || true
          git add arm/**/*.manifest || true
          if git diff --cached --quiet; then
            echo "No YAML changes to commit"
          else
            git commit -m "auto: convert ARM templates to YAML [skip ci]"
            # Someone may have pushed while the sync was running.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            # Pushes made with GITHUB_TOKEN don't trigger pull_request workflows,
            # so start CI explicitly to report the required checks on the new head.
            gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          fi
